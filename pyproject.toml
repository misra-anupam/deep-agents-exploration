[project]
name = "equity-desk"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "misra-anupam", email = "innocentangelfromhell@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.28",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pandas>=3.0.6",
]

[project.scripts]
equity-desk = "equity_desk.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
